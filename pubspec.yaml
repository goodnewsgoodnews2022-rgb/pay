name: fintech
description: A new Flutter project.

version: '1.0.0+1'

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Core UI Icons
  cupertino_icons: ^1.0.8

  # Infrastructure & Navigation (Dev 1 Core)
  supabase_flutter: ^2.12.4
  go_router: ^17.2.3
  dio: ^5.9.2
  web3dart: ^3.0.2
  http: ^1.6.0
  flutter_dotenv: ^5.0.2
  image_picker: ^1.1.2
  pdf: ^3.10.0
  printing: ^5.11.0

  # State Management & Architecture (Shared Team Modules)
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  get_it: ^9.2.1
  flutter_riverpod: ^3.3.2
  intl: ^0.19.0
  url_launcher: ^6.3.1
  flutterwave_standard: ^1.1.0
  flutterwave_standard_smart: ^1.0.4
  local_auth: ^3.0.1
 
  flutter_secure_storage: ^10.3.1
  google_sign_in: ^6.1.0
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/app_logo.png
    

# --- SPLASH SCREEN CONFIGURATION ---
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/app_logo.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/images/app_logo.png"
  web: false

# --- APP ICON CONFIGURATION ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21